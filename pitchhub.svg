<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Subtle background texture — pitch stripes -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="none"/>

  <!-- Ambient glow center -->
  <ellipse cx="256" cy="256" rx="160" ry="140" fill="#10b981" opacity="0.06" filter="url(#softGlow)"/>

  <!-- ============ PITCH ICON ============ -->
  <!-- Pitch outer border -->
  <rect x="88" y="148" width="336" height="216" rx="8" ry="8"
        fill="none" stroke="url(#glowGrad)" stroke-width="5" opacity="0.9" filter="url(#glow)"/>

  <!-- Pitch fill — very subtle green -->
  <rect x="88" y="148" width="336" height="216" rx="8" ry="8" fill="#10b981" opacity="0.04"/>

  <!-- Center line -->
  <line x1="256" y1="148" x2="256" y2="364"
        stroke="#10b981" stroke-width="3.5" opacity="0.8"/>

  <!-- Center circle -->
  <circle cx="256" cy="256" r="52"
          fill="none" stroke="url(#glowGrad)" stroke-width="3.5" opacity="0.85" filter="url(#glow)"/>

  <!-- Center spot -->
  <circle cx="256" cy="256" r="6" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Left penalty area -->
  <rect x="88" y="196" width="82" height="120" rx="0"
        fill="none" stroke="#10b981" stroke-width="3" opacity="0.7"/>

  <!-- Left goal area (6-yard box) -->
  <rect x="88" y="222" width="36" height="68" rx="0"
        fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.55"/>

  <!-- Left penalty spot -->
  <circle cx="144" cy="256" r="4.5" fill="#10b981" opacity="0.75"/>

  <!-- Left penalty arc -->
  <path d="M 170,196 A 52,52 0 0 0 170,316"
        fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"
        stroke-dasharray="none" clip-path="none"/>

  <!-- Right penalty area -->
  <rect x="342" y="196" width="82" height="120" rx="0"
        fill="none" stroke="#10b981" stroke-width="3" opacity="0.7"/>

  <!-- Right goal area (6-yard box) -->
  <rect x="388" y="222" width="36" height="68" rx="0"
        fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.55"/>

  <!-- Right penalty spot -->
  <circle cx="368" cy="256" r="4.5" fill="#10b981" opacity="0.75"/>

  <!-- Right penalty arc -->
  <path d="M 342,196 A 52,52 0 0 1 342,316"
        fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>

  <!-- Left goal posts -->
  <rect x="58" y="228" width="30" height="56" rx="3"
        fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.9" filter="url(#glow)"/>

  <!-- Right goal posts -->
  <rect x="424" y="228" width="30" height="56" rx="3"
        fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.9" filter="url(#glow)"/>

  <!-- Corner arcs -->
  <path d="M 88,160 A 18,18 0 0 1 100,148" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>
  <path d="M 412,148 A 18,18 0 0 1 424,160" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>
  <path d="M 88,352 A 18,18 0 0 0 100,364" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>
  <path d="M 412,364 A 18,18 0 0 0 424,352" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>

  <!-- Top accent line (brand stripe) -->
  <rect x="88" y="90" width="336" height="3" rx="1.5" fill="url(#glowGrad)" opacity="0.6"/>
  <!-- Bottom accent line -->
  <rect x="88" y="419" width="336" height="3" rx="1.5" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- ============ "P" monogram lettermark overlay (subtle) ============ -->
  <!-- Removed for clean icon look — pitch graphic speaks for itself -->

  <!-- Subtle vignette overlay -->
  <rect width="512" height="512" rx="112" ry="112"
        fill="url(#bgGrad)" opacity="0.15"/>
</svg>
